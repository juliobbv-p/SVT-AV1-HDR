  windows-msvc-enc-test:
    name: Windows Enc Test (MSVC)
    runs-on: windows-latest
    timeout-minutes: 120
    needs:
      - windows-msvc-release
    outputs:
      akiyo_m2: ${{ steps.hashes.outputs.akiyo_m2 }}
      akiyo_m8: ${{ steps.hashes.outputs.akiyo_m8 }}
      chimera_m2: ${{ steps.hashes.outputs.chimera_m2 }}
      chimera_m8: ${{ steps.hashes.outputs.chimera_m8 }}
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: svtav1-bin-windows-msvc-release
          path: Bin/Release/
      - name: Check home directory for akiyo & Chimera
        id: home-y4m
        run: |
          $AkiyoZst = Join-Path $HOME "akiyo_cif.y4m.zst"
          $ChimeraZst = Join-Path $HOME "Chimera-Aerial_480x264_2997fps_10bit_420_150frames.y4m.zst"
          $AkiyoFound = Test-Path -LiteralPath $AkiyoZst -PathType Leaf
          $ChimeraFound = Test-Path -LiteralPath $ChimeraZst -PathType Leaf

          if ($AkiyoFound -and $ChimeraFound) {
            Write-Host "Found both input archives in the home directory."
            Copy-Item -LiteralPath $AkiyoZst -Destination . -Force
            Copy-Item -LiteralPath $ChimeraZst -Destination . -Force
            $found = "true"
          } else {
            Write-Host "Akiyo or Chimera input archive not found in the home directory."
            $found = "false"
          }
          "found=$found" >> $env:GITHUB_OUTPUT
      - name: Restore test inputs from cache
        if: steps.home-y4m.outputs.found != 'true'
        id: cache-y4m
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            akiyo_cif.y4m.zst
            Chimera-Aerial_480x264_2997fps_10bit_420_150frames.y4m.zst
          key: y4m-clips
          enableCrossOsArchive: true
      - name: Decompress cached akiyo input
        if: steps.home-y4m.outputs.found == 'true' || steps.cache-y4m.outputs.cache-hit == 'true'
        run: |
          zstd -df akiyo_cif.y4m.zst
          zstd -df Chimera-Aerial_480x264_2997fps_10bit_420_150frames.y4m.zst
      - name: Download input clips from derf
        run: |
          if (-not (Test-Path akiyo_cif.y4m)) {
            Write-Host "Downloading akiyo_cif.y4m from aom-testing ..."
            Invoke-WebRequest -Uri https://gitlab.com/AOMediaCodec/aom-testing/-/raw/master/test-files/akiyo_cif.y4m.zst -OutFile akiyo_cif.y4m.zst
            zstd -d akiyo_cif.y4m.zst
          }
          if (-not (Test-Path Chimera-Aerial_480x264_2997fps_10bit_420_150frames.y4m)) {
            Write-Host "Downloading Chimera-Aerial_480x264_2997fps_10bit_420_150frames.y4m from aom-testing ..."
            Invoke-WebRequest -Uri https://gitlab.com/AOMediaCodec/aom-testing/-/raw/master/test-files/Chimera-Aerial_480x264_2997fps_10bit_420_150frames.y4m.zst -OutFile Chimera-Aerial_480x264_2997fps_10bit_420_150frames.y4m.zst
            zstd -d Chimera-Aerial_480x264_2997fps_10bit_420_150frames.y4m.zst
          }
      - name: Run encoding tests
        run: |
          .\Bin\Release\SvtAv1EncApp.exe --preset 2 -i akiyo_cif.y4m -n 17 -b test-pr-Windows-Release-8bit-m2.ivf
          .\Bin\Release\SvtAv1EncApp.exe --preset 8 -i akiyo_cif.y4m -n 120 -b test-pr-Windows-Release-8bit-m8.ivf
          .\Bin\Release\SvtAv1EncApp.exe --preset 2 -i Chimera-Aerial_480x264_2997fps_10bit_420_150frames.y4m -n 17 -b test-pr-Windows-Release-10bit-m2.ivf
          .\Bin\Release\SvtAv1EncApp.exe --preset 8 -i Chimera-Aerial_480x264_2997fps_10bit_420_150frames.y4m -n 120 -b test-pr-Windows-Release-10bit-m8.ivf
          .\Bin\Release\SvtAv1EncApp.exe --preset 2 --tune 5 -i akiyo_cif.y4m -n 17 -b test-pr-Windows-Release-8bit-m2-tune5.ivf
          .\Bin\Release\SvtAv1EncApp.exe --preset 8 --tune 5 -i akiyo_cif.y4m -n 120 -b test-pr-Windows-Release-8bit-m8-tune5.ivf
          .\Bin\Release\SvtAv1EncApp.exe --preset 2 --tune 5 -i Chimera-Aerial_480x264_2997fps_10bit_420_150frames.y4m -n 17 -b test-pr-Windows-Release-10bit-m2-tune5.ivf
          .\Bin\Release\SvtAv1EncApp.exe --preset 8 --tune 5 -i Chimera-Aerial_480x264_2997fps_10bit_420_150frames.y4m -n 120 -b test-pr-Windows-Release-10bit-m8-tune5.ivf
      - name: Save input clips to home and cache
        if: always()
        run: |
          if (-not (Test-Path akiyo_cif.y4m.zst)) {
            zstd -T0 --ultra -20 -f akiyo_cif.y4m -o akiyo_cif.y4m.zst
          }
          if (-not (Test-Path Chimera-Aerial_480x264_2997fps_10bit_420_150frames.y4m.zst)) {
            zstd -T0 --ultra -20 -f Chimera-Aerial_480x264_2997fps_10bit_420_150frames.y4m -o Chimera-Aerial_480x264_2997fps_10bit_420_150frames.y4m.zst
          }
          $AkiyoZst = "$HOME/akiyo_cif.y4m.zst"
          if (-not (Test-Path $AkiyoZst)) {
            Copy-Item akiyo_cif.y4m.zst $AkiyoZst
          }
          $ChimeraZst = "$HOME/Chimera-Aerial_480x264_2997fps_10bit_420_150frames.y4m.zst"
          if (-not (Test-Path $ChimeraZst)) {
            Copy-Item Chimera-Aerial_480x264_2997fps_10bit_420_150frames.y4m.zst $ChimeraZst
          }
      - name: Cache input clips
        if:
          steps.cache-y4m.outputs.cache-hit != 'true' && github.ref == format('refs/heads/{0}',
          github.event.repository.default_branch)
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            akiyo_cif.y4m.zst
            Chimera-Aerial_480x264_2997fps_10bit_420_150frames.y4m.zst
          key: ${{ steps.cache-y4m.outputs.cache-primary-key }}
          enableCrossOsArchive: true
      - name: Hash IVF outputs
        id: hashes
        run: |
          $akiyo_m2 = (Get-FileHash -Path test-pr-Windows-Release-8bit-m2.ivf -Algorithm SHA256).Hash.ToLowerInvariant()
          $akiyo_m8 = (Get-FileHash -Path test-pr-Windows-Release-8bit-m8.ivf -Algorithm SHA256).Hash.ToLowerInvariant()
          "akiyo_m2=$akiyo_m2" >> $env:GITHUB_OUTPUT
          "akiyo_m8=$akiyo_m8" >> $env:GITHUB_OUTPUT
          $chimera_m2 = (Get-FileHash -Path test-pr-Windows-Release-10bit-m2.ivf -Algorithm SHA256).Hash.ToLowerInvariant()
          $chimera_m8 = (Get-FileHash -Path test-pr-Windows-Release-10bit-m8.ivf -Algorithm SHA256).Hash.ToLowerInvariant()
          "chimera_m2=$chimera_m2" >> $env:GITHUB_OUTPUT
          "chimera_m8=$chimera_m8" >> $env:GITHUB_OUTPUT

  windows-ucrt64-release:
    name: Windows (mingw-w64 ucrt, Release)
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: 1
      CHERE_INVOKING: 1
      MSYS2_PATH_TYPE: inherit
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up GCC problem matcher
        uses: ammaraskar/gcc-problem-matcher@cb2e3f949c41b7818628f35f8484a9b0acf90cf9
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          pacboy: >-
            7zip ccache cmake cppcheck curl gcc git jq meson nasm ninja perl pkgconf python yasm zstd
      - name: Restore ccache
        id: cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: .ccache
          key:
            ${{ runner.os }}-svtav1-windows-ucrt64-release-${{
            hashFiles('**/CMakeLists.txt','**/*.cmake','Source/**','third_party/**','**/*.patch') }}
          restore-keys: ${{ runner.os }}-svtav1-windows-ucrt64-release-
      - name: Configure CMake
        env:
          CC: gcc
          CXX: g++
          CFLAGS: -Wshadow -pipe
          CXXFLAGS: -Wshadow -pipe
          LDFLAGS: -static -static-libgcc -static-libstdc++ -Wshadow -pipe
        run: |
          cmake -S "${GITHUB_WORKSPACE}" -B "${GITHUB_WORKSPACE}/Build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DREPRODUCIBLE_BUILDS=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSVT_AV1_LTO=OFF
      - name: Build
        run: |
          cmake --build "${GITHUB_WORKSPACE}/Build" --parallel
          ccache -s
      - name: Save ccache
        uses: actions/cache/save@v6.1.0
        if:
          always() && steps.cache.outputs.cache-hit != 'true' && github.ref == format('refs/heads/{0}',
          github.event.repository.default_branch)
        with:
          path: .ccache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7.0.0
        with:
          name: svtav1-bin-windows-ucrt64-release
          path: Bin/Release/SvtAv1EncApp.exe
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
          overwrite: true

