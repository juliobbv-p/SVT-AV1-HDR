name: Basic CI Workflow
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - 'Config/**'
      - '*.patch'
      - 'third_party/**'
      - 'test/e2e_test/test_vector_list.txt'
      - 'test/vectors/smoking_test.cfg'
      - 'test/vectors/video_src.cfg'
      - '*.png'
      - '*.PNG'
      - '*.pdf'
  pull_request:
    paths-ignore:
      - 'Config/**'
      - '*.patch'
      - 'third_party/**'
      - 'test/e2e_test/test_vector_list.txt'
      - 'test/vectors/smoking_test.cfg'
      - 'test/vectors/video_src.cfg'
      - '*.png'
      - '*.PNG'
      - '*.pdf'

jobs:
  version-check:
    name: Check version consistency
    runs-on: [self-hosted, linux]
    container:
      image: node:alpine
    if:
      ${{ !(github.event_name == 'push' && github.ref == format('refs/heads/{0}',
      github.event.repository.default_branch)) }}
    steps:
      - name: Install dependencies
        run: |
          apk update
          apk add cmake gcc g++ git nasm ninja pkgconf tar
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Cache build directory
        uses: actions/cache@v5.0.3
        with:
          path: ver
          key: version-check-${{ github.sha }}
          restore-keys: version-check-*
      - name: Configure CMake
        run: cmake -B ver -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Check version consistency
        run: |
          pkg_config_version=$(pkg-config --modversion ver/SvtAv1Enc.pc)
          cmake_version=$(grep 'PROJECT_VERSION:' ver/CMakeCache.txt | cut -d '=' -f2)
          header_version=$(
          cc -E -P -x c -I Source/API/ - <<'eof' | tail -n 1
          #include <EbSvtAv1.h>
          #define concat(a, b, c) a ## . ## b ## . ## c
          #define concat2(a, b, c) concat(a, b, c)
          concat2(SVT_AV1_VERSION_MAJOR, SVT_AV1_VERSION_MINOR, SVT_AV1_VERSION_PATCHLEVEL)
          eof
          )
          echo "Pkg-config version: $pkg_config_version"
          echo "CMake version: $cmake_version"
          echo "Header version: $header_version"
          if [[ "$pkg_config_version" != "$cmake_version" ]]; then
            echo "Error: pkg-config version ($pkg_config_version) does not match CMake version ($cmake_version)"
            exit 1
          fi
          if [[ "$header_version" != "$cmake_version" ]]; then
            echo "Error: Header version ($header_version) does not match CMake version ($cmake_version)"
            exit 1
          fi
          echo "Version consistency check passed."

  style-check:
    name: Style check
    runs-on: [self-hosted, linux]
    container:
      image: node:alpine
    steps:
      - name: Install dependencies
        run: |
          apk update
          apk add python3 clang-extra-tools curl git
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run style check
        env:
          CI_REPOSITORY_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/AOMediaCodec/SVT-AV1.git
          CI_MERGE_REQUEST_TARGET_BRANCH_NAME: ${{ github.event.pull_request.base.ref || 'HEAD' }}
        run: ./test/stylecheck.sh

  cppcheck:
    # For now, we allow cppcheck to fail since we can't fall back to ubuntu 18.04 due to issues
    # with node and glibc.
    name: Static analysis (cppcheck)
    runs-on: [self-hosted, linux]
    container:
      image: registry.gitlab.com/aomediacodec/aom-testing/ubuntu2404:20260303202728
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -yq cmake jq cppcheck gcc g++ git nasm ninja-build nodejs
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Cache cppcheck results
        uses: actions/cache/restore@v5.0.3
        id: cache
        with:
          path: .cppcheck
          key: ${{ runner.os }}-cppcheck-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cppcheck-*
      - name: Configure CMake
        run: cmake -B Build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Filter out .asm files from compile_commands.json
        run: jq '. | map(select(.file | test(".asm") | not))' Build/compile_commands.json > compile_commands.json
      - name: Run cppcheck
        run: |
          mkdir -p .cppcheck
          cppcheck \
            --project=compile_commands.json \
            --error-exitcode=1 \
            --enable=all \
            -j 2 \
            -rp=$PWD \
            -ithird_party \
            --cppcheck-build-dir=.cppcheck \
            --suppress=unusedFunction \
            --suppress=missingIncludeSystem \
            --template="::error file={file},line={line},col={column}::{file}:{line}:{column}: {severity}{inconclusive: (inconclusive)}: {message} [{id}]{cwe: (CWE-{cwe})}\\nCallstack: {callstack}\\n{code}" \
            --template-location="Note: {file}:{line}:{column}: {info}\\n{code}"
        continue-on-error: true
      - name: Save cppcheck results to cache
        uses: actions/cache/save@v5.0.3
        if: always() && steps.cache.outputs.cache-hit != 'true'
        with:
          path: .cppcheck
          key: ${{ runner.os }}-cppcheck-${{ github.sha }}

  linux-gcc-release:
    name: Linux (GCC, Release)
    runs-on: [self-hosted, linux]
    container:
      image: ubuntu:25.04
    env:
      CC: gcc
      CXX: g++
      CFLAGS: -Werror -Wshadow -pipe
      CXXFLAGS: -Werror -Wshadow -pipe
      LDFLAGS: -static -static-libgcc -static-libstdc++ -Werror -Wshadow -pipe
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: install dependencies
        run: |
          apt-get update
          apt-get install -yq ccache cmake gcc g++ git nasm ninja-build nodejs pkgconf
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run release build
        uses: ./.github/actions/compile
        with:
          cmake_build_type: Release
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7.0.0
        with:
          name: svtav1-bin-linux-release
          path: Bin/Release/SvtAv1EncApp
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
          overwrite: true

  linux-enc-test:
    name: Linux Enc Test
    runs-on: [self-hosted, linux]
    container:
      image: registry.gitlab.com/aomediacodec/aom-testing/ubuntu2404:20260303202728
    needs:
      - linux-gcc-release
    outputs:
      akiyo_m2: ${{ steps.hashes.outputs.akiyo_m2 }}
      akiyo_m8: ${{ steps.hashes.outputs.akiyo_m8 }}
      chimera_m2: ${{ steps.hashes.outputs.chimera_m2 }}
      chimera_m8: ${{ steps.hashes.outputs.chimera_m8 }}
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v7.0.0
        with:
          name: svtav1-bin-linux-release
          path: Bin/Release
      - name: Extract input vectors
        run: |
          cp /akiyo_cif.y4m.zst /Chimera-Aerial_480x264_2997fps_10bit_420_150frames.y4m.zst .
          zstd -df akiyo_cif.y4m.zst Chimera-Aerial_480x264_2997fps_10bit_420_150frames.y4m.zst
      - name: Run encoding tests
        run: |
          chmod +x Bin/Release/SvtAv1EncApp
          ./Bin/Release/SvtAv1EncApp --preset 2 -i akiyo_cif.y4m -n 17 -b test-pr-Linux-Release-8bit-m2.ivf
          ./Bin/Release/SvtAv1EncApp --preset 8 -i akiyo_cif.y4m -n 120 -b test-pr-Linux-Release-8bit-m8.ivf
          ./Bin/Release/SvtAv1EncApp --preset 2 -i Chimera-Aerial_480x264_2997fps_10bit_420_150frames.y4m -n 17 -b test-pr-Linux-Release-10bit-m2.ivf
          ./Bin/Release/SvtAv1EncApp --preset 8 -i Chimera-Aerial_480x264_2997fps_10bit_420_150frames.y4m -n 120 -b test-pr-Linux-Release-10bit-m8.ivf
      - name: Hash IVF outputs
        id: hashes
        run: |
          echo "akiyo_m2=$(sha256sum test-pr-Linux-Release-8bit-m2.ivf | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "akiyo_m8=$(sha256sum test-pr-Linux-Release-8bit-m8.ivf | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "chimera_m2=$(sha256sum test-pr-Linux-Release-10bit-m2.ivf | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "chimera_m8=$(sha256sum test-pr-Linux-Release-10bit-m8.ivf | awk '{print $1}')" >> "$GITHUB_OUTPUT"

  linux-enc-cbrvbr-test:
    name: Linux Enc CBRVBR Test (${{ matrix.bitness }}-bit)
    runs-on: [self-hosted, linux]
    container:
      image: registry.gitlab.com/aomediacodec/aom-testing/ubuntu2404:20260303202728
    needs:
      - linux-gcc-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - filename: akiyo_cif.y4m
            bitness: 8
          - filename: Chimera-Aerial_480x264_2997fps_10bit_420_150frames.y4m
            bitness: 10
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v7.0.0
        with:
          name: svtav1-bin-linux-release
          path: Bin/Release
      - name: Extract input vectors
        run: |
          cp /${{ matrix.filename }}.zst .
          zstd -df ${{ matrix.filename }}.zst
      - name: Run CBRVBR encoding tests
        run: |
          chmod +x Bin/Release/SvtAv1EncApp
          # 1-pass VBR
          ./Bin/Release/SvtAv1EncApp -i ${{ matrix.filename }} --rc 1 --tbr 100 --lp 1 \
            -b vbr1pass-pr-Linux_x86_64-Release-${{ matrix.bitness }}bit-m8.ivf --preset 8
          ./Bin/Release/SvtAv1EncApp -i ${{ matrix.filename }} --rc 1 --tbr 100 --lp 1 \
            -b vbr1pass-pr-Linux_x86_64-Release-${{ matrix.bitness }}bit-m12.ivf --preset 12
          # 2-pass VBR
          ./Bin/Release/SvtAv1EncApp -i ${{ matrix.filename }} --rc 1 --tbr 100 --lp 1 \
            -b vbr2pass-pr-Linux_x86_64-Release-${{ matrix.bitness }}bit-m8.ivf --passes 2 --preset 8
          ./Bin/Release/SvtAv1EncApp -i ${{ matrix.filename }} --rc 1 --tbr 100 --lp 1 \
            -b vbr2pass-pr-Linux_x86_64-Release-${{ matrix.bitness }}bit-m12.ivf --passes 2 --preset 12
          # 1-pass CBR
          ./Bin/Release/SvtAv1EncApp -i ${{ matrix.filename }} --rc 2 --tbr 100 --lp 1 \
            -b cbr-pr-Linux_x86_64-Release-${{ matrix.bitness }}bit-m8.ivf --pred-struct 1 --preset 8
          ./Bin/Release/SvtAv1EncApp -i ${{ matrix.filename }} --rc 2 --tbr 100 --lp 1 \
            -b cbr-pr-Linux_x86_64-Release-${{ matrix.bitness }}bit-m12.ivf --pred-struct 1 --preset 12

  linux-rc-test:
    name: Linux RC Test
    runs-on: [self-hosted, linux]
    container:
      image: registry.gitlab.com/aomediacodec/aom-testing/ubuntu2404:20260303202728
    needs:
      - linux-gcc-release
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v7.0.0
        with:
          name: svtav1-bin-linux-release
          path: Bin/Release
      - name: Extract input vectors
        run: |
          cp /akiyo_cif.y4m.zst /Chimera-Aerial_480x264_2997fps_10bit_420_150frames.y4m.zst .
          zstd -df akiyo_cif.y4m.zst Chimera-Aerial_480x264_2997fps_10bit_420_150frames.y4m.zst
      - name: Run rate control test
        run: |
          chmod +x Bin/Release/SvtAv1EncApp
          ret=true
          for ct in "akiyo_cif.y4m::71.18" "Chimera-Aerial_480x264_2997fps_10bit_420_150frames.y4m::241.02"; do
            clip="${ct%%::*}"
            target="${ct##*::}"
            [ -f "$clip" ] || continue
            printf 'Testing clip %s at target %s kbps\n' "$clip" "$target"
            bitrate=$(
              ./Bin/Release/SvtAv1EncApp \
                --preset 8 --lp 7 \
                --rc 1 --tbr "$target" \
                -n 300 -i "$clip" \
                --undershoot-pct 10 \
                --overshoot-pct 5 2>&1 |
                awk '$1" "$2 == "Total Frames" {getline; print $5}'
            )
            if [ -z "$bitrate" ]; then
              printf 'FAIL: could not parse bitrate for clip %s\n' "$clip"
              ret=false
              continue
            fi
            printf 'Measured bitrate: %s kbps\n' "$bitrate"
            if ! awk -v t="$target" -v b="$bitrate" 'BEGIN { exit !(t*0.9 < b && b < t*1.1) }'; then
              printf 'FAIL: clip %s target=%s actual=%s (not within 10%%)\n' "$clip" "$target" "$bitrate"
              ret=false
            fi
          done
          $ret

  # Build the target/default branch to enable bitstream regression detection.
  # Skipped when pushing directly to the default branch (nothing to compare against).
  linux-gcc-default-release:
    name: Linux (GCC, Release, Default Branch)
    runs-on: [self-hosted, linux]
    container:
      image: registry.gitlab.com/aomediacodec/aom-testing/ubuntu2404:20260303202728
    if:
      ${{ !(github.event_name == 'push' && github.ref == format('refs/heads/{0}',
      github.event.repository.default_branch)) }}
    env:
      CC: gcc
      CXX: g++
      CFLAGS: -Werror -Wshadow -pipe
      CXXFLAGS: -Werror -Wshadow -pipe
      LDFLAGS: -static -static-libgcc -static-libstdc++ -Werror -Wshadow -pipe
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout target/default branch
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout the local action from this branch
        uses: actions/checkout@v6.0.2
        with:
          path: action-src
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          sparse-checkout: ./.github/actions/compile/action.yaml
          persist-credentials: false
      - name: Run release build
        uses: ./action-src/.github/actions/compile
        with:
          cmake_build_type: Release
      - name: Upload default-branch release artifacts
        uses: actions/upload-artifact@v7.0.0
        with:
          name: svtav1-bin-linux-default-release
          path: Bin/Release/SvtAv1EncApp
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
          overwrite: true

  linux-default-enc-test:
    name: Linux Default Enc Test
    runs-on: [self-hosted, linux]
    container:
      image: registry.gitlab.com/aomediacodec/aom-testing/ubuntu2404:20260303202728
    needs:
      - linux-gcc-default-release
    outputs:
      akiyo_m2: ${{ steps.hashes.outputs.akiyo_m2 }}
      akiyo_m8: ${{ steps.hashes.outputs.akiyo_m8 }}
      chimera_m2: ${{ steps.hashes.outputs.chimera_m2 }}
      chimera_m8: ${{ steps.hashes.outputs.chimera_m8 }}
    steps:
      - name: Download default-branch release artifacts
        uses: actions/download-artifact@v7.0.0
        with:
          name: svtav1-bin-linux-default-release
          path: Bin/Release
      - name: Extract input vectors
        run: |
          cp /akiyo_cif.y4m.zst /Chimera-Aerial_480x264_2997fps_10bit_420_150frames.y4m.zst .
          zstd -df akiyo_cif.y4m.zst Chimera-Aerial_480x264_2997fps_10bit_420_150frames.y4m.zst
      - name: Run encoding tests
        run: |
          chmod +x Bin/Release/SvtAv1EncApp
          ./Bin/Release/SvtAv1EncApp --preset 2 -i akiyo_cif.y4m -n 17 -b test-default-Linux-Release-8bit-m2.ivf
          ./Bin/Release/SvtAv1EncApp --preset 8 -i akiyo_cif.y4m -n 120 -b test-default-Linux-Release-8bit-m8.ivf
          ./Bin/Release/SvtAv1EncApp --preset 2 -i Chimera-Aerial_480x264_2997fps_10bit_420_150frames.y4m -n 17 -b test-default-Linux-Release-10bit-m2.ivf
          ./Bin/Release/SvtAv1EncApp --preset 8 -i Chimera-Aerial_480x264_2997fps_10bit_420_150frames.y4m -n 120 -b test-default-Linux-Release-10bit-m8.ivf
      - name: Hash IVF outputs
        id: hashes
        run: |
          echo "akiyo_m2=$(sha256sum test-default-Linux-Release-8bit-m2.ivf | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "akiyo_m8=$(sha256sum test-default-Linux-Release-8bit-m8.ivf | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "chimera_m2=$(sha256sum test-default-Linux-Release-10bit-m2.ivf | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "chimera_m8=$(sha256sum test-default-Linux-Release-10bit-m8.ivf | awk '{print $1}')" >> "$GITHUB_OUTPUT"

  enc-default-diff-test:
    name: Enc Default Diff Test
    runs-on: [self-hosted, linux]
    container:
      image: ubuntu:25.04
    needs:
      - linux-enc-test
      - linux-default-enc-test
    # Soft failure: a diff flags a bitstream change but does not block merging.
    continue-on-error: true
    env:
      pr_akiyo_m2: ${{ needs.linux-enc-test.outputs.akiyo_m2 }}
      pr_akiyo_m8: ${{ needs.linux-enc-test.outputs.akiyo_m8 }}
      pr_chimera_m2: ${{ needs.linux-enc-test.outputs.chimera_m2 }}
      pr_chimera_m8: ${{ needs.linux-enc-test.outputs.chimera_m8 }}
      default_akiyo_m2: ${{ needs.linux-default-enc-test.outputs.akiyo_m2 }}
      default_akiyo_m8: ${{ needs.linux-default-enc-test.outputs.akiyo_m8 }}
      default_chimera_m2: ${{ needs.linux-default-enc-test.outputs.chimera_m2 }}
      default_chimera_m8: ${{ needs.linux-default-enc-test.outputs.chimera_m8 }}
    steps:
      - name: Compare enc output hashes against default branch
        run: |
          success=true
          check() {
            name="$1" pr="$2" default="$3"
            if [ "$pr" != "$default" ]; then
              echo "::warning::Bitstream changed for $name: default=$default pr=$pr"
              success=false
            fi
          }
          check "akiyo 8-bit m2"   "${pr_akiyo_m2}"   "${default_akiyo_m2}"
          check "akiyo 8-bit m8"   "${pr_akiyo_m8}"   "${default_akiyo_m8}"
          check "chimera 10-bit m2" "${pr_chimera_m2}" "${default_chimera_m2}"
          check "chimera 10-bit m8" "${pr_chimera_m8}" "${default_chimera_m8}"
          if $success; then
            echo "All outputs match the default branch."
          else
            echo "One or more outputs differ from the default branch. This may be an intentional bitstream change."
          fi
